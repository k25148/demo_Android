```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ゼミ紹介AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #startButton {
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      position: fixed;
      z-index: 9999;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="status">画面をタップして音声を有効にしてください</div>
  <button id="startButton">ARを開始</button>

  <!-- 動画素材 -->
  <video
    id="demoVideo"
    src="demotopass.mp4"
    preload="auto"
    loop
    playsinline
    webkit-playsinline
    crossorigin="anonymous"
    style="display: none;">
  </video>

  <!-- ARシーン -->
  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="arVideo"
        src="demotopass.mp4"
        preload="auto"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#arVideo"
        width="1"
        height="1.7778"
        position="0 0 0">
      </a-video>
    </a-entity>

  </a-scene>

  <script>
    const video = document.querySelector("#arVideo");
    const target = document.querySelector("[mindar-image-target]");
    const startButton = document.querySelector("#startButton");
    const status = document.querySelector("#status");
    const scene = document.querySelector("a-scene");

    let userAllowedAudio = false;
    let targetVisible = false;
    let arReady = false;

    // ARの準備ができたら開始ボタンを有効化
    scene.addEventListener("arReady", () => {
      arReady = true;
      status.textContent = "AR準備完了。画像をカメラに映してください";
    });

    // ボタンのタップを音声再生の許可に利用
    startButton.addEventListener("click", async () => {
      userAllowedAudio = true;
      startButton.style.display = "none";

      status.textContent = arReady
        ? "画像をカメラに映してください"
        : "ARを準備しています…";

      // タップ直後に再生を試して、ブラウザの再生制限に対応
      try {
        video.muted = false;
        await video.play();

        // まだ対象画像が見つかっていない場合は停止
        if (!targetVisible) {
          video.pause();
          video.currentTime = 0;
        } else {
          status.textContent = "動画を再生中";
        }
      } catch (error) {
        console.error("動画再生エラー:", error);
        status.textContent =
          "再生できません。もう一度画面をタップしてください";
        startButton.style.display = "block";
      }
    });

    // 写真を認識したら動画を再生
    target.addEventListener("targetFound", async () => {
      targetVisible = true;
      status.textContent = "画像を認識しました";

      video.currentTime = 0;

      if (userAllowedAudio) {
        try {
          video.muted = false;
          await video.play();
          status.textContent = "動画を再生中";
        } catch (error) {
          console.error("動画再生エラー:", error);
          status.textContent = "動画を再生できませんでした";
        }
      } else {
        status.textContent = "画面の「ARを開始」をタップしてください";
      }
    });

    // 写真を見失ったら動画を停止
    target.addEventListener("targetLost", () => {
      targetVisible = false;
      video.pause();
      status.textContent = "画像をカメラに映してください";
    });

    // 動画の読み込みエラーを表示
    video.addEventListener("error", () => {
      console.error("動画読み込みエラー:", video.error);
      status.textContent =
        "動画を読み込めません。ファイル名と配置を確認してください";
    });
  </script>

</body>
</html>
