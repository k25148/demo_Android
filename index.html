
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>demotopassAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    canvas {
      background: transparent !important;
    }

    #androidPlayButton {
      display: none;
      visibility: visible;
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 15px 22px;
      border: none;
      border-radius: 12px;
      background: rgba(20, 20, 20, 0.9);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    #androidMessage {
      display: none;
      position: fixed;
      z-index: 10000;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      max-width: 90%;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 14px;
      text-align: center;
    }
  </style>

  <script>
    const isAndroid = /Android/i.test(navigator.userAgent);

    // Androidテスト用シェーダー
    // 白背景除去を行わず、動画をそのまま描画する
    AFRAME.registerShader('android-video-test', {
      schema: {
        src: { type: 'map' }
      },

      vertexShader: `
        varying vec2 vUv;

        void main() {
          vUv = uv;

          gl_Position =
            projectionMatrix *
            modelViewMatrix *
            vec4(position, 1.0);
        }
      `,

      fragmentShader: `
        uniform sampler2D src;
        varying vec2 vUv;

        void main() {
          gl_FragColor = texture2D(src, vUv);
        }
      `
    });

    // iPhone版の元のシェーダーを維持
    AFRAME.registerShader('pure-white-key', {
      schema: {
        src: { type: 'map' }
      },

      vertexShader: `
        varying vec2 vUv;

        void main() {
          vUv = uv;

          gl_Position =
            projectionMatrix *
            modelViewMatrix *
            vec4(position, 1.0);
        }
      `,

      fragmentShader: `
        uniform sampler2D src;
        varying vec2 vUv;

        void main() {
          vec4 color = texture2D(src, vUv);

          bool pureWhite =
            color.r > 0.999 &&
            color.g > 0.999 &&
            color.b > 0.999;

          if (pureWhite) {
            gl_FragColor = vec4(0.0, 0.0, 0.0, 0.0);
          } else {
            gl_FragColor = color;
          }
        }
      `
    });
  </script>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="demoVideo"
        src="demotopass.mp4"
        preload="auto"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="imageTarget"
      mindar-image-target="targetIndex: 0">

      <a-plane
        id="videoPlane"
        width="1"
        height="1.7778"
        position="0 0 0"
        material="
          shader: pure-white-key;
          src: #demoVideo;
          transparent: true;
          side: double;
          depthWrite: false;
        ">
      </a-plane>

    </a-entity>

  </a-scene>

  <button id="androidPlayButton" type="button">
    動画を再生（音声あり）
  </button>

  <div id="androidMessage" role="status"></div>

  <script>
    const video = document.querySelector('#demoVideo');
    const target = document.querySelector('#imageTarget');
    const plane = document.querySelector('#videoPlane');

    const playButton =
      document.querySelector('#androidPlayButton');

    const message =
      document.querySelector('#androidMessage');

    let targetVisible = false;

    // Android版だけテスト用シェーダーに切り替える
    if (isAndroid) {
      plane.setAttribute('material', {
        shader: 'android-video-test',
        src: '#demoVideo',
        transparent: false,
        side: 'double',
        depthWrite: true
      });

      // 起動時からボタンを表示する
      playButton.style.display = 'block';
      playButton.style.visibility = 'visible';
    }

    function showMessage(text) {
      message.textContent = text;
      message.style.display = 'block';
    }

    function hideMessage() {
      message.style.display = 'none';
    }

    target.addEventListener('targetFound', () => {
      targetVisible = true;
      video.currentTime = 0;

      if (isAndroid) {
        // ボタンを自動的に隠さない
        playButton.disabled = false;
        playButton.style.display = 'block';
        playButton.style.visibility = 'visible';
        hideMessage();
      } else {
        // iPhone版は元の再生処理を維持
        video.play().catch(error => {
          console.error('動画再生エラー:', error);
        });
      }
    });

    target.addEventListener('targetLost', () => {
      targetVisible = false;
      video.pause();

      if (isAndroid) {
        playButton.disabled = false;
        playButton.style.display = 'block';
        playButton.style.visibility = 'visible';
      }
    });

    // Android版：ボタン操作で音声付き再生
    playButton.addEventListener('click', async () => {
      if (!isAndroid) return;

      if (!targetVisible) {
        showMessage(
          '先に認識用の画像をカメラに映してください。'
        );
        return;
      }

      playButton.disabled = true;
      hideMessage();

      try {
        video.muted = false;
        video.volume = 1;

        await video.play();

        // 再生成功後もボタンは表示したままにする
        playButton.disabled = false;
        playButton.textContent = '再生中（音声あり）';
      } catch (error) {
        console.error('動画再生エラー:', error);

        playButton.disabled = false;
        playButton.textContent = 'もう一度再生する';

        showMessage(
          '再生に失敗しました。もう一度タップしてください。'
        );
      }
    });

    video.addEventListener('error', () => {
      console.error('動画読み込みエラー:', video.error);

      if (isAndroid) {
        showMessage(
          '動画を読み込めません。動画ファイルのパスを確認してください。'
        );
      }
    });
  </script>

</body>
</html>
