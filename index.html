
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>demotopassAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    canvas {
      background: transparent !important;
    }
  </style>

  <script>
    AFRAME.registerShader('pure-white-key', {
      schema: {
        src: { type: 'map' }
      },

      vertexShader: `
        varying vec2 vUv;

        void main() {
          vUv = uv;
          gl_Position = projectionMatrix
            * modelViewMatrix
            * vec4(position, 1.0);
        }
      `,

      fragmentShader: `
        uniform sampler2D src;
        varying vec2 vUv;

        void main() {
          vec4 color = texture2D(src, vUv);

          // RGBすべてがほぼ最大値の純白の場合だけ透明化
          bool pureWhite =
            color.r > 0.999 &&
            color.g > 0.999 &&
            color.b > 0.999;

          if (pureWhite) {
            gl_FragColor = vec4(0.0, 0.0, 0.0, 0.0);
          } else {
            gl_FragColor = color;
          }
        }
      `
    });
  </script>
</head>

<body>
  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="demoVideo"
        src="demotopass.mp4"
        preload="auto"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane
        width="1"
        height="1.7778"
        position="0 0 0"
        material="
          shader: pure-white-key;
          src: #demoVideo;
          transparent: true;
          side: double;
          depthWrite: false;
        ">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const video = document.querySelector("#demoVideo");
    const target = document.querySelector("[mindar-image-target]");

    target.addEventListener("targetFound", () => {
      video.currentTime = 0;

      video.play().catch(error => {
        console.error("動画再生エラー:", error);
      });
    });

    target.addEventListener("targetLost", () => {
      video.pause();
    });
  </script>
</body>
</html>
