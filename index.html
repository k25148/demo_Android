
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>demotopassAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    canvas {
      background: transparent !important;
    }
  </style>

  <script>
    // 白い背景を透明にするシェーダー
    AFRAME.registerShader('white-key', {
      schema: {
        src: { type: 'map' },
        threshold: { type: 'number', default: 0.93
         },
        softness: { type: 'number', default: 0.12 }
      },

      vertexShader: `
        varying vec2 vUv;

        void main() {
          vUv = uv;
          gl_Position = projectionMatrix
            * modelViewMatrix
            * vec4(position, 1.0);
        }
      `,

      fragmentShader: `
        uniform sampler2D src;
        uniform float threshold;
        uniform float softness;

        varying vec2 vUv;

        void main() {
          vec4 color = texture2D(src, vUv);

          // RGBのうち最も暗い成分を使って白さを判定
          float whiteness = min(
            color.r,
            min(color.g, color.b)
          );

          // 白に近いほど透明にする
          float alpha = 1.0 - smoothstep(
            threshold,
            threshold + softness,
            whiteness
          );

          gl_FragColor = vec4(color.rgb, color.a * alpha);
        }
      `
    });
  </script>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="demoVideo"
        src="demotopass.mp4"
        preload="auto"
        loop
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-plane
        width="1"
        height="1.7778"
        position="0 0 0"
        rotation="0 0 0"
        material="
          shader: white-key;
          src: #demoVideo;
          threshold: 0.88;
          softness: 0.12;
          transparent: true;
          side: double;
          depthWrite: false;
        ">
      </a-plane>

    </a-entity>

  </a-scene>

  <script>
    const video = document.querySelector("#demoVideo");
    const target = document.querySelector(
      "[mindar-image-target]"
    );

    target.addEventListener("targetFound", () => {
      video.currentTime = 0;

      video.play().catch(error => {
        console.error("動画再生エラー:", error);
      });
    });

    target.addEventListener("targetLost", () => {
      video.pause();
    });
  </script>

</body>
</html>
